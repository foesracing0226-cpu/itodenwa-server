<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>糸でんわ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    button {
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      transition: background 0.2s;
    }
    button:active { opacity: 0.8; }
    .status {
      font-size: 0.85rem;
      text-align: center;
      color: #666;
    }
    /* 映像表示エリア */
    .video-container {
      position: relative;
      width: 100%;
      height: 220px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #localVideo {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 80px;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #fff;
      background: #222;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .controls button {
      flex: 1 1 30%;
      padding: 8px 2px;
      font-size: 0.75rem;
    }
    .btn-orange { background-color: #ff9800; }
    .btn-blue { background-color: #2196F3; }
    .btn-purple { background-color: #9C27B0; }
    .btn-teal { background-color: #009688; }
    .btn-pink { background-color: #E91E63; }

    .chat-box {
      height: 100px;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      font-size: 0.85rem;
      background: #fafafa;
    }
    .chat-box img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 4px;
      transition: transform 0.2s;
    }
    .chat-box img:hover {
      opacity: 0.9;
    }
    .chat-input {
      display: flex;
      gap: 8px;
    }
    .hidden-input {
      display: none;
    }

    /* 画像拡大表示（モーダル）のスタイル */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
    }
    .modal img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      object-fit: contain;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
    }
    .modal-buttons button, .modal-buttons a {
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      text-decoration: none;
      color: white;
      cursor: pointer;
      text-align: center;
    }
    .btn-download { background-color: #4CAF50; }
    .btn-close { background-color: #777; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🧵 糸でんわ 📞 (WebRTC)</h1>
    
    <input type="text" id="roomId" placeholder="ルームIDを入力 (例: 1234)">
    <button id="joinBtn" onclick="joinRoom()">ルームに参加 🏡</button>
    
    <div class="status" id="status">サーバーに接続中...</div>

    <!-- 映像表示エリア -->
    <div class="video-container">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- コントロールボタン -->
    <div class="controls">
      <button id="micBtn" class="btn-orange" onclick="toggleMic()">🎙️ マイク ON</button>
      <button id="camBtn" class="btn-blue" onclick="toggleCam()">📹 カメラ ON</button>
      <button id="switchCamBtn" class="btn-purple" onclick="switchCamera()">🔄 切替</button>
      <button class="btn-pink" onclick="document.getElementById('cameraInput').click()">📷 撮影</button>
      <button class="btn-teal" onclick="document.getElementById('galleryInput').click()">🖼️ アルバム</button>
      
      <!-- カメラ直接起動用インプット -->
      <input type="file" id="cameraInput" class="hidden-input" accept="image/*" capture="environment" onchange="sendImage(event)">
      <!-- ギャラリー選択用インプット -->
      <input type="file" id="galleryInput" class="hidden-input" accept="image/*" onchange="sendImage(event)">
    </div>

    <!-- チャットエリア -->
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
      <input type="text" id="msgInput" placeholder="メッセージを入力...">
      <button onclick="sendMsg()">💌</button>
    </div>
  </div>

  <!-- 画像拡大モーダル -->
  <div id="imageModal" class="modal" onclick="closeModal(event)">
    <img id="modalImg" src="" alt="拡大画像">
    <div class="modal-buttons" onclick="event.stopPropagation()">
      <a id="downloadLink" class="btn-download" download="sent_image.png">💾 保存する</a>
      <button class="btn-close" onclick="closeModal()">✕ 閉じる</button>
    </div>
  </div>

  <script>
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    let pc = null;
    let localStream = null;
    let roomId = null;
    let isMicOn = true;
    let isCamOn = true;
    let currentFacingMode = 'user';

    const configuration = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    ws.onopen = () => {
      document.getElementById('status').innerText = 'サーバーに接続しました 🗄️ ルームIDを入力してください 💳';
    };

    ws.onclose = () => {
      document.getElementById('status').innerText = 'サーバーとの接続が切れました。';
    };

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === 'offer') {
        if (!pc) createPeerConnection();
        await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', answer }));
      } else if (msg.type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
      } else if (msg.type === 'candidate') {
        if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
      } else if (msg.type === 'text') {
        addChatMessage('相手: ' + msg.text);
      } else if (msg.type === 'image') {
        addImageMessage('相手', msg.image);
      }
    };

    async function startMedia(facingMode = 'user') {
      try {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }

        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: { facingMode: facingMode }
        });
        
        document.getElementById('localVideo').srcObject = localStream;

        if (pc) {
          const videoTrack = localStream.getVideoTracks()[0];
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) {
            sender.replaceTrack(videoTrack);
          }
        }
      } catch (err) {
        console.error('メディア取得失敗:', err);
        document.getElementById('status').innerText = 'カメラ/マイクの許可が必要です。';
      }
    }

    async function joinRoom() {
      roomId = document.getElementById('roomId').value.trim();
      if (!roomId) return alert('ルームIDを入力してください');

      await startMedia(currentFacingMode);

      ws.send(JSON.stringify({ type: 'join', room: roomId }));
      document.getElementById('status').innerText = `ルーム [${roomId}] に参加中...`;

      createPeerConnection();

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', offer }));
    }

    function createPeerConnection() {
      pc = new RTCPeerConnection(configuration);

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
      };
    }

    function toggleMic() {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        isMicOn = !isMicOn;
        audioTrack.enabled = isMicOn;
        const btn = document.getElementById('micBtn');
        btn.innerText = isMicOn ? '🎙️ マイク ON' : '🔇 マイク OFF';
        btn.style.backgroundColor = isMicOn ? '#ff9800' : '#888';
      }
    }

    function toggleCam() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        isCamOn = !isCamOn;
        videoTrack.enabled = isCamOn;
        const btn = document.getElementById('camBtn');
        btn.innerText = isCamOn ? '📹 カメラ ON' : '📷 カメラ OFF';
        btn.style.backgroundColor = isCamOn ? '#2196F3' : '#888';
      }
    }

    async function switchCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      await startMedia(currentFacingMode);
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      
      ws.send(JSON.stringify({ type: 'text', text }));
      addChatMessage('自分: ' + text);
      input.value = '';
    }

    function sendImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        ws.send(JSON.stringify({ type: 'image', image: base64Image }));
        addImageMessage('自分', base64Image);
      };
      reader.readAsDataURL(file);
    }

    function addChatMessage(msg) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.innerText = msg;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addImageMessage(sender, imgSrc) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.innerHTML = `<strong>${sender}:</strong><br><img src="${imgSrc}" style="cursor: pointer;" onclick="openModal('${imgSrc}')">`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function openModal(imgSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      const downloadLink = document.getElementById('downloadLink');

      modalImg.src = imgSrc;
      downloadLink.href = imgSrc;
      modal.style.display = 'flex';
    }

    function closeModal(event) {
      if (!event || event.target.id === 'imageModal' || event.target.tagName === 'BUTTON') {
        document.getElementById('imageModal').style.display = 'none';
      }
    }
  </script>
</body>
</html>
