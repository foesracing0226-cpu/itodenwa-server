<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 🧵 糸でんわ 📞</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    button {
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      transition: background 0.2s;
    }
    button:active { opacity: 0.8; }
    .status {
      font-size: 0.85rem;
      text-align: center;
      color: #666;
    }
    /* 映像表示エリア */
    .video-container {
      position: relative;
      width: 100%;
      height: 240px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #localVideo {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 90px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #fff;
      background: #222;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .controls button {
      flex: 1;
      font-size: 0.9rem;
    }
    .btn-orange { background-color: #ff9800; }
    .btn-blue { background-color: #2196F3; }
    
    .chat-box {
      height: 120px;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      font-size: 0.85rem;
      background: #fafafa;
    }
    .chat-input {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🧵 糸でnわ 📞 (WebRTC)</h1>
    
    <input type="text" id="roomId" placeholder="ルームIDを入力 (例: 1234)">
    <button id="joinBtn" onclick="joinRoom()">ルームに参加 🏡</button>
    
    <div class="status" id="status">サーバーに接続中...</div>

    <!-- 映像表示エリア（相手がメイン、自分が右下の小窓） -->
    <div class="video-container">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- コントロールボタン -->
    <div class="controls">
      <button id="micBtn" class="btn-orange" onclick="toggleMic()">🎙️ マイク ON</button>
      <button id="camBtn" class="btn-blue" onclick="toggleCam()">📹 カメラ ON</button>
    </div>

    <!-- チャットエリア -->
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
      <input type="text" id="msgInput" placeholder="メッセージを入力...">
      <button onclick="sendMsg()">送信</button>
    </div>
  </div>

  <script>
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    let pc = null;
    let localStream = null;
    let roomId = null;
    let isMicOn = true;
    let isCamOn = true;

    const configuration = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    ws.onopen = () => {
      document.getElementById('status').innerText = 'サーバーに接続しました 📟 ルームIDを入力してください 💳';
    };

    ws.onclose = () => {
      document.getElementById('status').innerText = 'サーバーとの接続が切れました。';
    };

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === 'offer') {
        if (!pc) createPeerConnection();
        await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'answer', answer }));
      } else if (msg.type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
      } else if (msg.type === 'candidate') {
        if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
      } else if (msg.type === 'text') {
        addChatMessage('相手: ' + msg.text);
      }
    };

    async function startMedia() {
      try {
        // カメラとマイクの両方を取得
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) {
        console.error('メディア取得失敗:', err);
        document.getElementById('status').innerText = 'カメラ/マイクの許可が必要です。';
      }
    }

    async function joinRoom() {
      roomId = document.getElementById('roomId').value.trim();
      if (!roomId) return alert('ルームIDを入力してください');

      await startMedia();

      ws.send(JSON.stringify({ type: 'join', room: roomId }));
      document.getElementById('status').innerText = `ルーム [${roomId}] に参加中...`;

      createPeerConnection();

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', offer }));
    }

    function createPeerConnection() {
      pc = new RTCPeerConnection(configuration);

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
      };
    }

    function toggleMic() {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        isMicOn = !isMicOn;
        audioTrack.enabled = isMicOn;
        const btn = document.getElementById('micBtn');
        btn.innerText = isMicOn ? '🎙️ マイク ON' : '🔇 マイク OFF';
        btn.style.backgroundColor = isMicOn ? '#ff9800' : '#888';
      }
    }

    function toggleCam() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        isCamOn = !isCamOn;
        videoTrack.enabled = isCamOn;
        const btn = document.getElementById('camBtn');
        btn.innerText = isCamOn ? '📹 カメラ ON' : '📷 カメラ OFF';
        btn.style.backgroundColor = isCamOn ? '#2196F3' : '#888';
      }
    }

    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      
      ws.send(JSON.stringify({ type: 'text', text }));
      addChatMessage('自分: ' + text);
      input.value = '';
    }

    function addChatMessage(msg) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.innerText = msg;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
